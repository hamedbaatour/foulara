giftIncluded:['FOULARA gift box included','Boîte cadeau FOULARA incluse','علبة هدية FOULARA مرفقة'],standardPack:['Standard packaging included','Emballage standard inclus','تغليف عادي مرفق'],materials:['Materials & design','Matières & motif','الخامة والتصميم'],sizeStyling:['Size & styling','Dimensions & style','المقاس والتنسيق'],delivery:['Preorders & delivery','Précommandes & livraison','الطلب المسبق والتوصيل'],sizeDescription:['The 180 × 70 cm rectangular format offers multiple styling possibilities. Use a measuring tape to picture the length and width.','Le format rectangulaire de 180 × 70 cm permet plusieurs façons de le porter. Utilisez un mètre pour visualiser ses dimensions.','يتيح المقاس المستطيل 180 × 70 سم خيارات تنسيق متنوعة. استخدمي شريط قياس لتصوّر الطول والعرض.'],preorderDescription:['This scarf is currently sold out. Submit a preorder request without paying now. Availability, timing, delivery charges and final terms must be confirmed before payment.','Ce foulard est actuellement épuisé. Envoyez une demande de précommande sans payer. Disponibilité, délai, frais de livraison et conditions finales seront à confirmer avant paiement.','نفد هذا الوشاح حالياً. أرسلي طلباً مسبقاً دون دفع الآن. يجب تأكيد التوفر والموعد ورسوم التوصيل والشروط النهائية قبل الدفع.'],askQuestion:['Ask a question','Poser une question','اطلبي معلومات'],
vintageIntro:['Floral artistry and intricate arabesque details, brought together in premium satin. A signature scarf created to celebrate five years of FOULARA.','Art floral et arabesques raffinées se rencontrent sur un satin premium. Un foulard signature créé pour célébrer les cinq ans de FOULARA.','زهور ونقوش أرابيسك دقيقة تجتمع على ساتان فاخر. وشاح مميز صُمم للاحتفال بخمس سنوات من FOULARA.'],rosetteIntro:['A new chapter of the Rosette Collection. Soft chiffon and a rich floral composition, with the signature FOULARA touch.','Un nouveau chapitre de la collection Rosette. Une mousseline douce et une composition florale généreuse, avec la touche FOULARA.','فصل جديد من مجموعة Rosette. شيفون ناعم وتكوين غني بالزهور بلمسة FOULARA المميزة.'],shadhaIntro:['A chiffon foulard with vintage-inspired florals and a distinctive double-sided frame, designed for everyday and casual styling.','Un foulard en mousseline, aux fleurs vintage et au cadre distinctif à double face, pensé pour les tenues du quotidien.','وشاح شيفون بزهور مستوحاة من الطابع الكلاسيكي وإطار مميز على الوجهين، لإطلالات يومية مريحة.'],
giftKicker:['Part of the experience','Une attention qui compte','جزء من التجربة'],giftTitle:['Beautifully presented.<br><em>Ready to give.</em>','Joliment présenté.<br><em>Prêt à offrir.</em>','بتقديم أنيق.<br><em>جاهز للإهداء.</em>'],giftCopy:['Your scarf comes in a FOULARA gift box, giving this floral design a presentation to match.','Votre foulard est présenté dans une boîte cadeau FOULARA, à la hauteur de son motif fleuri.','يأتي وشاحك في علبة هدية FOULARA، بتقديم يليق بتصميمه الزهري.'],morePieces:['More from FOULARA','D’autres modèles FOULARA','المزيد من FOULARA'],anotherMood:['Another shade, another mood','Une autre teinte, une autre envie','لون آخر وإحساس مختلف'],
storyTitle:['Flowers, arabesques<br>and <em>FOULARA.</em>','Des fleurs, des arabesques<br>et <em>FOULARA.</em>','زهور وأرابيسك<br>وحكاية <em>FOULARA.</em>'],storyIntro:['Five years of creativity, expressed through scarves.','Cinq ans de créativité, exprimés à travers nos foulards.','خمس سنوات من الإبداع تعبّر عنها أوشحتنا.'],storyP1:['Vintage Garden was created to mark FOULARA’s fifth anniversary. It brings together the elements that define the FOULARA aesthetic: rich floral compositions, refined arabesques and delicate ornamentation.','Vintage Garden a été créé pour le cinquième anniversaire de FOULARA. Il réunit les éléments de notre esthétique : compositions florales généreuses, arabesques raffinées et ornements délicats.','صُممت Vintage Garden للاحتفال بالذكرى الخامسة لـ FOULARA، وجمعت عناصر أسلوبنا: الزهور الغنية ونقوش الأرابيسك الراقية والزخارف الرقيقة.'],storyP2:['The V Collection celebrates that history in premium satin. Alongside it, Rosette + and Shadha explore floral compositions in soft chiffon, each with its own expression.','La Collection V célèbre cette histoire sur un satin premium. À ses côtés, Rosette + et Shadha déclinent l’art floral sur une mousseline douce, chacune à sa façon.','تحتفي مجموعة V بهذه الحكاية على الساتان الفاخر. وإلى جانبها، تستكشف Rosette + وShadha التكوينات الزهرية على الشيفون الناعم، لكل منهما طابعها.'],storyP3:['Our current pieces are sold out. Preorders are open, with availability and delivery confirmed before any payment.','Nos modèles actuels sont épuisés. Les précommandes sont ouvertes, avec disponibilité et livraison à confirmer avant tout paiement.','نفدت قطعنا الحالية. الطلب المسبق متاح مع تأكيد التوفر والتوصيل قبل أي دفع.'],

receivedKicker:['Request recorded','Demande enregistrée','تم تسجيل الطلب'],receivedTitle:['Your request is with us.','Votre demande est enregistrée.','تم تسجيل طلبك لدينا.'],receivedCopy:['Your preorder request has been recorded. No payment has been taken. Keep your reference for any questions about your selection.','Votre demande de précommande est enregistrée. Aucun paiement n’a été prélevé. Conservez votre référence pour toute question.','تم تسجيل طلبك المسبق دون أي دفع. احتفظي برقم الطلب لأي استفسار عن اختياراتك.'],reference:['Your reference','Votre référence','رقم طلبك'],requestError:['We could not record your request. Please try again. Your selection is still in your bag.','Votre demande n’a pas pu être enregistrée. Réessayez. Votre sélection est toujours dans le panier.','تعذّر تسجيل طلبك. حاولي مجدداً. اختياراتك ما زالت في السلة.'],rateError:['Too many requests. Please wait a few minutes and try again.','Trop de demandes. Veuillez patienter quelques minutes puis réessayer.','طلبات كثيرة. انتظري بضع دقائق ثم حاولي مجدداً.'],
contactKicker:['Let’s talk scarves','Parlons foulards','لنتحدث عن الأوشحة'],contactTitle:['A little help,<br><em>before you choose.</em>','Un peu d’aide,<br><em>avant de choisir.</em>','نحن هنا لمساعدتك<br><em>قبل الاختيار.</em>'],contactIntro:['Ask about a design, your preorder, delivery or return conditions. Include your request reference if you have one.','Posez une question sur un modèle, votre précommande, la livraison ou les retours. Ajoutez votre référence si vous en avez une.','اسألينا عن تصميم أو طلب مسبق أو التوصيل أو شروط الإرجاع. أضيفي رقم طلبك إن وجد.'],contactShipping:['Delivery & return conditions','Livraison & conditions de retour','التوصيل وشروط الإرجاع'],contactShippingCopy:['These details are confirmed individually before payment. No delivery date or return entitlement is promised by submitting a preorder.','Ces détails sont à confirmer individuellement avant paiement. Une demande de précommande ne garantit ni date de livraison ni droit de retour.','تُؤكّد هذه التفاصيل لكل طلب قبل الدفع. لا يضمن تقديم الطلب المسبق تاريخاً للتوصيل أو حقاً محدداً للإرجاع.'],subject:['Subject','Objet','الموضوع'],message:['Your message','Votre message','رسالتك'],sendMessage:['Send message','Envoyer le message','إرسال الرسالة'],messageReceived:['Your message is recorded.','Votre message est enregistré.','تم تسجيل رسالتك.'],messageCopy:['Keep this reference if you need to follow up.','Conservez cette référence pour tout suivi.','احتفظي بهذا الرقم لمتابعة استفسارك.'],
helpTitle:['A clear way to preorder.','Précommander en toute clarté.','الطلب المسبق بكل وضوح.'],helpIntro:['What to know before requesting a sold-out scarf.','L’essentiel avant de demander un foulard épuisé.','ما تحتاجين معرفته قبل طلب وشاح نفد مخزونه.'],howPreorder:['How preorders work','Comment précommander','كيف يعمل الطلب المسبق'],helpP1:['Choose your scarf, add it to your preorder bag and send your contact details. Your request is recorded for review. A preorder request does not guarantee stock or a delivery date.','Choisissez votre foulard, ajoutez-le au panier de précommande puis envoyez vos coordonnées. Votre demande est enregistrée pour étude. Elle ne garantit ni stock ni date de livraison.','اختاري وشاحك وأضيفيه إلى سلة الطلب المسبق ثم أرسلي بيانات التواصل. يُسجّل طلبك للمراجعة، ولا يضمن توفّر مخزون أو تاريخاً للتوصيل.'],paymentQ:['Do I pay when I preorder?','Dois-je payer à la précommande ?','هل أدفع عند تقديم الطلب المسبق؟'],paymentA:['No. This site does not collect payment or card details. Any purchase requires confirmation of availability, final pricing, delivery charges and terms first.','Non. Ce site ne collecte ni paiement ni données bancaires. Tout achat nécessite d’abord la confirmation de la disponibilité, du prix final, des frais de livraison et des conditions.','لا. لا يجمع هذا الموقع أي دفعات أو بيانات بطاقات. يتطلب أي شراء تأكيد التوفر والسعر النهائي ورسوم التوصيل والشروط أولاً.'],timingQ:['When will my scarf be available?','Quand mon foulard sera-t-il disponible ?','متى سيتوفر وشاحي؟'],timingA:['A restock or dispatch date has not been announced. Ask about your selection using the contact form.','Aucune date de réapprovisionnement ou d’expédition n’est annoncée. Renseignez-vous via le formulaire de contact.','لم يُعلن موعد لإعادة التوفر أو الإرسال. استفسري عن اختياراتك عبر نموذج التواصل.'],currencyQ:['How are the prices displayed?','Comment les prix sont-ils affichés ?','كيف تُعرض الأسعار؟'],currencyA:['USD is the default. You can display estimates in EUR or TND. Estimates use a fixed conversion reference from 24 October 2026; final pricing must be confirmed before payment.','L’USD est la devise par défaut. Les estimations sont aussi disponibles en EUR et TND. Le taux de référence est fixé au 24 octobre 2026 ; le prix final reste à confirmer avant paiement.','الدولار الأمريكي هو العملة الافتراضية، ويمكن عرض التقديرات باليورو أو الدينار التونسي. تعتمد التقديرات مرجع تحويل ثابتاً بتاريخ 24 أكتوبر 2026، ويجب تأكيد السعر النهائي قبل الدفع.'],returnsQ:['What about delivery and returns?','Quelles sont les conditions de livraison et de retour ?','ما شروط التوصيل والإرجاع؟'],returnsA:['Delivery availability, charges, timing and return conditions depend on the confirmed order. Ask for these details before making any payment.','Disponibilité de livraison, frais, délais et retours dépendent de la commande confirmée. Demandez ces détails avant tout paiement.','يتوقف التوصيل ورسومه ومواعيده وشروط الإرجاع على الطلب المؤكد. اطلبي هذه التفاصيل قبل أي دفع.'],changeQ:['Can I change my preorder request?','Puis-je modifier ma demande ?','هل يمكنني تعديل طلبي المسبق؟'],changeA:['Send a message with your request reference and explain what you would like to change.','Envoyez un message avec votre référence et précisez la modification souhaitée.','أرسلي رسالة تتضمن رقم طلبك والتعديل الذي ترغبين فيه.'],
privacyTitle:['Your details, with a purpose.','Vos données, pour votre demande.','بياناتك لخدمة طلبك.'],privacyP1:['The preorder form collects your name, email address, delivery country, selected products and any optional phone number or notes you provide. The contact form collects your name, email address, subject and message.','Le formulaire de précommande collecte votre nom, e-mail, pays de livraison, produits choisis et les coordonnées ou notes facultatives. Le formulaire de contact collecte votre nom, e-mail, objet et message.','يجمع نموذج الطلب المسبق اسمك وبريدك وبلد التوصيل والمنتجات المختارة وأي رقم هاتف أو ملاحظات اختيارية. ويجمع نموذج التواصل اسمك وبريدك وموضوعك ورسالتك.'],privacyP2:['Requests are stored by this storefront and queued for delivery to FOULARA’s order inbox. They are used to handle your request. No payment card details are collected.','Les demandes sont enregistrées par cette boutique et mises en file d’envoi vers la boîte de réception FOULARA. Elles servent à traiter votre demande. Aucune donnée de carte bancaire n’est collectée.','تُحفظ الطلبات في المتجر وتُدرج لإرسالها إلى بريد طلبات FOULARA بهدف معالجتها. لا تُجمع بيانات بطاقات الدفع.'],privacyP3:['Your language, currency, saved pieces and bag are stored in your browser. Form drafts and the latest request reference stay within your browser session. You can clear browser storage to remove those local preferences.','Langue, devise, favoris et panier sont enregistrés dans votre navigateur. Les brouillons et la dernière référence restent dans votre session. Effacer le stockage du navigateur supprime ces préférences locales.','تُحفظ اللغة والعملة والمفضلة والسلة في متصفحك. وتبقى مسودات النماذج ورقم آخر طلب ضمن جلسة التصفح. يمكنك حذف التخزين المحلي لإزالة هذه التفضيلات.'],privacyP4:['To ask about your recorded details, use the contact form and include your request reference.','Pour toute question sur vos données, utilisez le formulaire de contact avec votre référence.','للاستفسار عن بياناتك ال function updateRouteMetadata(){const {path}=parseRoute();const canonical=location.origin+path+(lang==='en'?'':'?lang='+lang);const link=$('link[rel="canonical"]');if(link)link.href=canonical;const description=currentProduct?t(currentProduct.description):t(path==='/shop'?'shopIntro':path==='/collections'?'collectionIntro':path==='/contact'?'contactIntro':path==='/help'?'helpIntro':path==='/story'?'storyIntro':'heroIntro');$('meta[name="description"]').content=description;for(const key of ['title','description','url']){const meta=$('meta[property="og:'+key+'"]');if(meta)meta.content=key==='title'?document.title:key==='description'?description:canonical}$$('link[hreflang]').forEach(el=>{const l=el.hreflang;el.href=location.origin+path+(l==='fr'||l==='ar'?'?lang='+l:'')});let robots=$('meta[name="robots"]');if(['/checkout','/confirmation','/saved'].includes(path)){if(!robots){robots=document.createElement('meta');robots.name='robots';document.head.append(robots)}robots.content='noindex,follow'}else robots?.remove();let schema=$('script[type="application/ld+json"]');if(currentProduct){if(!schema){schema=document.createElement('script');schema.type='application/ld+json';document.head.append(schema)}const image=ASSETS[currentProduct.photos[0]];schema.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Product',name:currentProduct.name+' · '+t(currentProduct.color),description,sku:currentProduct.id,brand:{'@type':'Brand',name:'FOULARA'},material:t(currentProduct.material),size:'180 × 70 cm',url:canonical,image:image.startsWith('/')?location.origin+image:image});const ogImage=$('meta[property="og:image"]');if(ogImage&&image.startsWith('/'))ogImage.content=location.origin+image}else schema?.remove();}
function navigate(route){if(!window.__FOULARA_SERVER__){location.hash=route;return}scrollPositions[routeKey()]=scrollY;history.pushState(null,'',localizedRoute(route));if(location.pathname==='/')scrollPositions[routeKey()]=0;render();animateRoute();$('#main-content').focus({preventScroll:true});scheduleStickyPurchase()}
window.addEventListener('popstate',()=>{render();$('#main-content').focus({preventScroll:true});scheduleStickyPurchase()});
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||!window.__FOULARA_SERVER__||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;const href=a.getAttribute('href');if(!href.startsWith('/')||href.startsWith('//'))return;e.preventDefault();e.stopImmediatePropagation();$$('dialog[open]').forEach(d=>closeDialog(d));navigate(href)},true);
function render(preserve=false){const y=preserve?scrollY:0;observer?.disconnect();lazyImages?.disconnect();document.body.classList.remove('locked');currentProduct=null;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#skip-link').textContent=t('skip');$('#site-header').innerHTML=header();const {path,params}=parseRoute();let html,title;if(path==='/'){html=home();title='FOULARA'}else if(path==='/shop'){html=shop(params);title=t('shop')}else if(path==='/collections'){html=collections();title=t('collections')}else if(path.startsWith('/product/')){const p=productById(path.split('/')[2]);html=p?product(p):empty('flower','notFound','notFoundCopy');title=p?p.name+' · '+t(p.color):'FOULARA'}else if(path==='/story'){html=story();title=t('story')}else if(path==='/saved'){html=savedPage();title=t('saved')}else if(path==='/checkout'){html=checkout();title=t('checkoutKicker')}else if(path==='/confirmation'){html=receipt();title=t('receivedKicker')}else if(path==='/contact'){html=contact();title=t('contact')}else if(path==='/help'){html=help();title=t('help')}else if(path==='/privacy'){html=privacy();title=t('privacy')}else{html=empty('flower','notFound','notFoundCopy');title='FOULARA'}$('#main-content').innerHTML=html;$('#site-footer').innerHTML=footer();$('#dialogs').innerHTML=dialogs();setupDialogs();renderBag();document.title=title==='FOULARA'?'FOULARA · '+t('footerTag'):title+' | FOULARA';$('#sticky-container').innerHTML=currentProduct?`<div class="mobile-buy"><p>${t(currentProduct.color)} · ${t('soldOut')}<strong>${money(unitPrice(currentProduct))}</strong></p><button class="primary" data-action="add" data-id="${currentProduct.id}"><span class="preorder-button-copy"><strong>${t('preorderCta')}</strong><span>${t('noPaymentShort')}</span></span></button></div>`:'';if(currentProduct){observer=new IntersectionObserver(([entry])=>{$('.mobile-buy')?.classList.toggle('visible',entry.boundingClientRect.top<0||entry.boundingClientRect.bottom>innerHeight)},{threshold:0});observer.observe($('#purchase-controls'));selectPhoto(0);setupSwipe()}$$('img').forEach(image=>image.addEventListener('error',()=>{image.alt=t('imageError')}));window.scrollTo({top:preserve?y:scrollPositions[routeKey()]||0,behavior:'instant'});lastRoute=routeKey();hydrateRouteLinks();hydrateImages();updateRouteMetadata();requestAnimationFrame(scheduleStickyPurchase)}
function changeShopParam(key,value){const {params}=parseRoute();if(value&&value!=='all')params.set(key,value);else params.delete(key);navigate('/shop'+(params.toString()?'?'+params:''))}
document.addEventListener('click',async e=>{const link=e.target.closest('a[href]');if(link){const href=link.getAttribute('href');if(href==='#main-content'){e.preventDefault();$('#main-content').focus();return}if(href===location.hash){$$('dialog[open]').forEach(d=>closeDialog(d));if(href==='#/checkout')render(true)}else if(href.startsWith('#/')){scrollPositions[location.hash]=scrollY}}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;if(action==='close'){closeDialog(b.closest('dialog'))}else if(action==='menu'){const open=b.getAttribute('aria-expanded')!=='true';setMenu(open)}else if(action==='search'){openDialog('search-dialog',b)}else if(action==='bag'){renderBag();openDialog('bag-dialog',b)}else if(action==='save'){saved=saved.includes(id)?saved.filter(v=>v!==id):[...saved,id];storage.set('foulara-store-saved',JSON.stringify(saved));if(parseRoute().path==='/saved'){render(true)}else{$$('[data-action="save"]').filter(x=>x.dataset.id===id).forEach(x=>{x.setAttribute('aria-pressed',String(saved.includes(id)));x.setAttribute('aria-label',t(saved.includes(id)?'unsave':'save'))})}toast(t(saved.includes(id)?'savedToast':'unsavedToast'))}else if(action==='add'){const amount=currentProduct?Math.max(1,Math.min(9,Number($('#detail-quantity').value)||1)):1;if((bag[id]||0)+amount>9){toast(t('limit'));return}bag[id]=(bag[id]||0)+amount;persistBag();renderBag();openDialog('bag-dialog',b)}else if(action==='bag-minus'||action==='bag-plus'||action==='remove'){if(action==='remove'){const item=b.closest('.bag-item');await motion(item,[{height:item.getBoundingClientRect().height+'px',opacity:1},{height:'0px',opacity:0,marginBlock:'0px',paddingBlock:'0px'}],200);delete bag[id];}else bag[id]=Math.max(1,Math.min(9,bag[id]+(action==='bag-plus'?1:-1)));persistBag();renderBag();if(action==='remove'){($('#bag-body button')||$('#bag-dialog [data-action="close"]')).focus()}else{$$(`#bag-body [data-action="${action}"]`).find(el=>el.dataset.id===id)?.focus()}}else if(action==='detail-minus'||action==='detail-plus'){updateDetailQuantity(Number($('#detail-quantity').value)+(action==='detail-plus'?1:-1))}else if(action==='size'){openDialog('size-dialog',b)}else if(action==='photo'){selectPhoto(Number(b.dataset.index))}else if(action==='zoom'){selectPhoto(photoIndex);openDialog('zoom-dialog',b)}else if(action==='previous'){selectPhoto(photoIndex-1)}else if(action==='next'){selectPhoto(photoIndex+1)}else if(action==='magnify'){setMagnified(!$('.zoom-stage').classList.contains('magnified'))}else if(action==='filter'){changeShopParam('material',b.dataset.filter)}});
document.addEventListener('change',e=>{if(e.target.id==='language'){const form=$('form[data-form="preorder"],form[data-form="message"]');if(form)persistDraft(form);lang=e.target.value;storage.set('foulara-language',lang);syncURLLanguage();render(true)}else if(e.target.id==='currency'){currency=e.target.value;storage.set(currencyStorageKey,currency);render(true)}else if(e.target.id==='sort'){changeShopParam('sort',e.target.value)}else if(e.target.id==='detail-quantity'){updateDetailQuantity(e.target.value)}else if(e.target.dataset.bagId){bag[e.target.dataset.bagId]=Math.max(1,Math.min(9,Math.floor(Number(e.target.value)||1)));persistBag();renderBag()}});
document.addEventListener('input',e=>{const form=e.target.closest('form');if(form&&['preorder','message'].includes(form.dataset.form))persistDraft(form)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#mobile-nav')?.hidden){setMenu(false)}if($('#zoom-dialog')?.open){if(e.key==='ArrowRight'){e.preventDefault();selectPhoto(photoIndex+1)}else if(e.key==='ArrowLeft'){e.preventDefault();selectPhoto(photoIndex-1)}if(e.target.id==='zoom-image'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setMagnified(!$('.zoom-stage').classList.contains('magnified'))}}});
document.addEventListener('click',e=>{if(e.target.id==='zoom-image')setMagnified(!$('.zoom-stage').classList.contains('magnified'));if(!e.target.closest('.header')&&$('#mobile-nav')){setMenu(false)}});
function setupSwipe(){const button=$('.photo-button');let start=0,suppress=false;button.addEventListener('touchstart',e=>{start=e.changedTouches[0].clientX},{passive:true});button.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>50){selectPhoto(photoIndex+(delta<0?1:-1));suppress=true;setTimeout(()=>suppress=false,350)}},{passive:true});button.addEventListener('click',e=>{if(suppress){e.preventDefault();e.stopPropagation();suppress=false}},true)}
document.addEventListener('keydown',e=>{if(!currentProduct||$('dialog[open]')||!e.target.closest('.gallery'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();selectPhoto(photoIndex+(e.key==='ArrowRight'?1:-1))}});
let stickyFramePending=false;
function syncStickyPurchase(){stickyFramePending=false;const controls=$('#purchase-controls'),sticky=$('.mobile-buy');if(controls&&sticky){const r=controls.getBoundingClientRect();sticky.classList.toggle('visible',r.top<0||r.bottom>innerHeight)}}
function scheduleStickyPurchase(){if(!stickyFramePending){stickyFramePending=true;requestAnimationFrame(syncStickyPurchase)}}
window.addEventListener('scroll',scheduleStickyPurchase,{passive:true});
window.addEventListener('resize',scheduleStickyPurchase,{passive:true});
window.addEventListener('hashchange',scheduleStickyPurchase);
document.addEventListener('change',scheduleStickyPurchase);
document.addEventListener('submit',async e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const kind=form.dataset.form,fd=new FormData(form);if(kind==='search'){$$('#dialogs dialog[open]').forEach(d=>closeDialog(d));navigate('/shop?q='+encodeURIComponent(String(fd.get('q')).trim()));return}if(!form.reportValidity())return;persistDraft(form);const payload=Object.fromEntries(fd);payload.language=lang;if(kind==='preorder'){payload.items=bagEntries().map(p=>({id:p.id,quantity:bag[p.id]}));payload.currency=currency;payload.consent=form.elements.consent.checked}const fingerprint=JSON.stringify(payload);if(pending[kind]?.fingerprint!==fingerprint){pending[kind]={fingerprint,key:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)};session.set('foulara-pending',pending)}const button=form.querySelector('[type="submit"]'),error=form.querySelector('.form-error');error.hidden=true;button.disabled=true;button.textContent=t('sending');form.setAttribute('aria-busy','true');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const response=await fetch(kind==='preorder'?'/api/preorders':'/api/messages',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':pending[kind].key},body:JSON.stringify(payload),signal:controller.signal});const result=await response.json();if(!response.ok||!result.reference){const failure=new Error('request');failure.status=response.status;throw failure}delete pending[kind];session.set('foulara-pending',pending);if(kind==='preorder'){lastReceipt={reference:result.reference};session.set('foulara-last-receipt',lastReceipt);bag={};persistBag();draft={};session.set('foulara-form-draft',draft);navigate('/confirmation')}else{form.innerHTML=`<div class="inline-success">${icon('check')}<h2>${t('messageReceived')}</h2><p>${t('messageCopy')}</p><div class="reference"><bdi>${escape(result.reference)}</bdi></div><a class="text-link" href="#/shop">${t('continueBrowse')}${arrow()}</a></div>`;draft={};session.set('foulara-form-draft',draft)}}catch(failure){error.hidden=false;error.textContent=t(failure.status===429?'rateError':kind==='preorder'?'requestError':'messageError');button.disabled=false;button.innerHTML=t(kind==='preorder'?'sendPreorder':'sendMessage')+arrow();error.scrollIntoView({block:'center',behavior:'smooth'})}finally{clearTimeout(timer);form.removeAttribute('aria-busy')}});
window.addEventListener('hashchange',()=>{scrollPositions[lastRoute]=scrollY;render();$('#main-content').focus({preventScroll:true})});
matchMedia('(min-width:761px)').addEventListener('change',e=>{if(e.matches&&$('#mobile-nav')){setMenu(false)}});
render();
